services:
  postgres:
    image: postgres:16-alpine
    container_name: mcpilot-db
    environment:
      POSTGRES_USER: mcpadmin
      POSTGRES_PASSWORD: mcpadmin123
      POSTGRES_DB: mcpilot
    ports:
      - "5432:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpadmin -d mcpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcpilot-backend
    ports:
      - "8020:8020"
    environment:
      - SECRET_KEY=change-this-secret-key-in-production
      - ADMIN_PASSWORD=admin123
      - DATABASE_URL=postgresql+asyncpg://mcpadmin:mcpadmin123@postgres:5432/mcpilot
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8020

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcpilot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

networks:
  default:
    name: mcpilot-net
